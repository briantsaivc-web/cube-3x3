<!doctype html>
<!--
  src/ui/index.template.html — 打包用 HTML 樣板（版型 C：學習導向；game-spec.md §11.1）
  依分派單 T-001 S8a（X-7 空殼移交後由本段改寫，所有權見 docs/reports/T-001-S8a.md）。
  build/bundle.js 會依序把下面本檔內文出現的五個 INJECT 標記換成實際內容：
  CSS（styles.css、demo.css、overlay.css）、VERSION（window.GAME_VERSION）、
  DATA（window.GAME_DATA）、WORKER（window.SOLVER_WORKER_SRC）、
  JS（主 bundle：迷你模組註冊器＋ui/app.js 等）。

  文字內容一律由 app.js／controls.js 等模組於掛載時從 window.GAME_DATA.texts 填入
  （§11.4：UI 只呈現 state；文案集中在 texts.json，方便 game-designer 潤飾不必改本檔）。
  只有一份 DOM（手機直向與 iPad 橫向共用，靠 CSS @media (orientation: landscape) 切版面），
  同頁不得有重複 id（game-spec.md §11.1 差異第 5 點）。

  版面：
    .shell            版型 C 的左右兩欄（橫向）／單欄（直向）容器
      .leftcol          狀態列 → 方塊區 → 操作列
      #learnDrawer      學習面板（iPad：右欄常駐；手機：方塊下方抽屜）
    [data-slot=overlay] 完成畫面等置中卡片（S8d）

  插槽（分派單 §3 S8a）：data-slot="lesson-button|lesson-card|overlay|hint-button|hint|demo|solver-status"
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>魔術方塊</title>
<style>
/* src/ui/styles.css — 主樣式：版型 C（學習導向）＋ CSS 3D 方塊（game-spec.md §9、§11） */
/* 依分派單 T-001 S8a；視覺參考 docs/ui/v1-C.html（行為與尺寸以規格為準，見 §11.1 差異表）。 */

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  height: 100%;
  background: #e7e7e4;
  color: #111;
  font-family: "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
}
button { font-family: inherit; }
[hidden] { display: none !important; }

.app { position: relative; height: 100%; overflow: hidden; }
.shell { display: flex; flex-direction: column; height: 100%; background: #fff; }
.leftcol { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }

/* ---- 狀態列 ---- */
.statusbar {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 18px;
  padding: 8px 14px; font-size: 13px;
  border-bottom: 1px solid #eee;
}
.statusbar .stat { display: flex; flex-direction: column; line-height: 1.25; }
.statusbar .k { color: #777; font-size: 11px; }
.statusbar .v { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
/* ---- D-19：步數旁的 QTM 小說明（texts.hud.qtmNote），可點元素 ≥44×44 ---- */
.statusbar .v-row { display: flex; align-items: center; gap: 4px; }
.qtm-note-btn {
  min-width: 44px; min-height: 44px; padding: 0; border-radius: 999px;
  border: 1.5px solid #999; background: #fff; color: #666; font-size: 13px; font-weight: 700;
}
.qtm-note-btn[aria-expanded="true"] { border-color: #0a6cff; color: #0a6cff; background: #eef3ff; }
.qtm-note-line {
  flex: 0 0 auto; padding: 6px 14px; font-size: 12px; color: #555; line-height: 1.5;
  background: #f2f6ff; border-bottom: 1px solid #dbe6ff;
}
.badge {
  display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px;
  border-radius: 999px; font-size: 12px; font-weight: 700;
  background: #fff3cd; color: #8a6100; border: 1px solid #f0c96a;
}

/* ---- 方塊 3D 舞台 ---- */
.cube-scene {
  position: relative; flex: 1 1 auto; min-height: 0;
  display: flex; align-items: center; justify-content: center;
  perspective: 900px; touch-action: none; background: #f7f8fa;
}
.cube-stage { position: relative; width: 0; height: 0; }
.cube3d { position: relative; width: 0; height: 0; transform-style: preserve-3d; }
.cube-world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }

.cube-scene { --cs: 34px; --gap: 2px; --step: calc(var(--cs) + var(--gap)); }
@media (orientation: landscape) { .cube-scene { --cs: 46px; } }

.cubie {
  position: absolute; width: var(--cs); height: var(--cs);
  left: calc(var(--cs) / -2); top: calc(var(--cs) / -2);
  transform-style: preserve-3d;
  transform: translate3d(calc(var(--gx) * var(--step)), calc(var(--gy) * var(--step)), calc(var(--gz) * var(--step)));
}
.face {
  position: absolute; width: var(--cs); height: var(--cs);
  border-radius: calc(var(--cs) * .14);
  box-shadow: inset 0 0 0 calc(var(--cs) * .07) rgba(0, 0, 0, .35);
  display: flex; align-items: center; justify-content: center;
  backface-visibility: hidden;
}
.f-F { transform: translateZ(calc(var(--cs) / 2)); }
.f-B { transform: rotateY(180deg) translateZ(calc(var(--cs) / 2)); }
.f-R { transform: rotateY(90deg) translateZ(calc(var(--cs) / 2)); }
.f-L { transform: rotateY(-90deg) translateZ(calc(var(--cs) / 2)); }
.f-U { transform: rotateX(90deg) translateZ(calc(var(--cs) / 2)); }
.f-D { transform: rotateX(-90deg) translateZ(calc(var(--cs) / 2)); }
.face.is-hi { box-shadow: inset 0 0 0 calc(var(--cs) * .16) #ffb300, 0 0 8px 2px rgba(255, 179, 0, .8); }

.face-label {
  pointer-events: none; text-align: center; line-height: 1.1;
  font-size: calc(var(--cs) * .26); font-weight: 700; user-select: none;
}
.face-label b { display: block; font-size: calc(var(--cs) * .34); }
.face-label i { display: block; font-style: normal; font-size: calc(var(--cs) * .2); opacity: .85; }
/* D-20：U 面（頂面）用 rotateX(90deg) 折起，在固定基準視角（baseViewDeg x:-22°）下
   會讓標籤文字明顯歪斜（見 docs/reports/T-001-arch-decisions.md D-20）。基準視角是常數，
   所以用固定角度的 2D 反向旋轉即可讓文字保持從目前視角可讀；此值僅對應 baseViewDeg，
   若日後改動基準視角需要重新用截圖核對（見 T-001-S8e 回報）。其餘五面（F／R／D／L／B）
   在目前視角下皆可讀，不需要此修正。 */
.f-U .face-label { transform: rotate(-25deg); }

.turn-wrapper { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }

/* D-18：提示浮層原本固定貼在 .cube-scene 內的右上角、寬度可達 78vw，手機直向時
   方塊區本來就矮（學習面板抽屜預設展開就占掉畫面 56vh），會整個蓋住方塊與層高亮
   （見 docs/reports/T-001-arch-decisions.md D-18）。改成：手機直向（本區塊，行動裝置
   優先）時 .hint-slot 是方塊區與操作列之間的一般文件流（index.template.html 已把它
   搬出 .cube-scene，改放在方塊區下緣、操作列上方），完全不會與方塊重疊，沒有提示時
   內容清空、高度歸零，不佔版面；iPad 橫向（見下方 @media landscape）改回貼在方塊右上角
   的浮層，維持原本設計（iPad 空間充裕，右上角浮層本來就沒有蓋住方塊的問題）。 */
.hint-slot {
  flex: 0 0 auto; display: flex; justify-content: center; padding: 0 4%;
  pointer-events: none;
}
.hint-slot > * { pointer-events: auto; margin: 4px 0; }

.scramble-line {
  flex: 0 0 auto; padding: 4px 14px; font-size: 12px; color: #555; line-height: 1.5;
}
.scramble-note { color: #999; }

/* ---- 操作列 ---- */
.controlbar { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 12px; border-top: 1px solid #eee; }
.ctl {
  min-width: 44px; min-height: 44px; padding: 0 12px; border-radius: 10px;
  border: 1.5px solid #333; background: #fff; color: #111; font-size: 13.5px;
}
.ctl:disabled { opacity: .4; }
.ctl.accent { border-color: #0a6cff; color: #fff; background: #0a6cff; }
.slot-inline { display: inline-flex; }

/* D-20：手機 390 寬時操作列（打亂／撤銷／重做／重設／提示／看電腦解，共 6 個控制項）
   要一行放下，不能換行壓縮方塊區。縮小間距與左右內距，同時保持 min-height:44px
   （CLAUDE.md §3.4 觸控熱區下限不可退讓）。400px 以下才套用，iPad 橫向不受影響。 */
@media (max-width: 400px) {
  .controlbar { gap: 4px; padding: 8px 8px; flex-wrap: nowrap; }
  .controlbar .ctl { padding: 0 6px; font-size: 12px; letter-spacing: -0.2px; }
}

/* ---- 學習面板／抽屜（版型 C；game-spec.md §11.1） ---- */
/* 手機直向：一般文件流的抽屜，收合時只剩手把列（max-height 限制＋overflow hidden，
   不使用 position:absolute／fixed，避免蓋住方塊區，見 decision-log 備註 3）。 */
.drawer {
  flex: 0 0 auto; display: flex; flex-direction: column; min-height: 0; background: #fafbfc;
  max-height: 30vh; overflow: hidden; transition: max-height .25s ease;
}
.drawer.expanded { max-height: 56vh; }
.drawer.expanded .cpanel { overflow-y: auto; }
.drawer:not(.expanded) .ctabs,
.drawer:not(.expanded) .cpanel { display: none; }
.drawer-handle { display: flex; align-items: stretch; min-height: 44px; border-top: 1px solid #e2e2e2; }
.handle-tap {
  flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 44px; cursor: pointer;
}
.handle-tap .drawer-label { font-size: 12px; color: #888; }
.handle-tap .bar { width: 40px; height: 5px; border-radius: 3px; background: #ccc; margin-top: 4px; }
.handle-tools { display: flex; align-items: center; gap: 8px; padding: 0 10px; }

.switch {
  min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 999px;
  border: 1.5px solid #999; background: #fff; color: #555; font-size: 13px;
}
.switch[aria-checked="true"] { border-color: #0a6cff; color: #0a6cff; background: #eef3ff; font-weight: 700; }

.ctabs { display: flex; gap: 8px; padding: 8px 12px 0; }
.ctab { flex: 1; min-height: 44px; border-radius: 10px; border: 1.5px solid #333; background: #fff; color: #111; font-size: 13.5px; }
.ctab.on { background: #111; color: #fff; }

.cpanel { flex: 1 1 auto; overflow-y: auto; padding: 10px 12px 16px; min-height: 0; }

.lesson-card {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: #fff;
  padding: 14px 16px; overflow-y: auto; z-index: 3;
}

/* ---- 記號鍵盤（game-spec.md §11.2） ---- */
.keypad { display: flex; flex-direction: column; gap: 10px; }
.kp-group { display: flex; flex-direction: column; }
.kp-caption { font-size: 12px; color: #777; margin-bottom: 4px; }
.kp-caption-toggle {
  align-self: flex-start; min-height: 44px; padding: 0 10px; border-radius: 8px;
  border: 1px solid #ccc; background: #f5f5f5; color: #555; font-size: 12px;
}
.kp-rows { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.kp-row { display: flex; gap: 6px; }
.kp {
  flex: 1; min-width: 44px; min-height: 44px; border-radius: 9px;
  border: 1.5px solid #333; background: #fafafa; color: #111;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15;
}
.kp-move { font-size: 15px; font-weight: 700; }
.kp-sub { font-size: 10px; color: #666; }
.kp.kp-mid { background: #eef3ff; border-color: #0a6cff; color: #0a3b8f; }
.kp.kp-rot { background: #f2f2f2; border-style: dashed; border-color: #999; color: #555; }

/* S13／D-35（QA Minor-1）：iPad 橫向記號鍵中文副標原為 10px，偏小。
   以視窗寬度分兩段放大，並把鍵的左右內距縮為 2px，讓最長的四字副標（如「上・半圈」）
   在一列 6 顆鍵時仍放得下一行：寬 ≥1100px（iPad 1133／1180／1194／1366 橫向）用 13px；
   1000–1099px（iPad 1024／1080 橫向）用 12px。手機直向另見下方 D-36（11px＋內距 2px；12px 會換行）；
   手機橫向（寬 < 1000px）不套用（量測見 docs/reports/T-001-S13.md）。
   只改字級與左右內距，按鍵 min-width／min-height 44px 不動。 */
@media (orientation: landscape) and (min-width: 1000px) {
  .kp { padding-left: 2px; padding-right: 2px; }
  .kp-sub { font-size: 12px; }
}
@media (orientation: landscape) and (min-width: 1100px) {
  .kp-sub { font-size: 13px; }
}
/* 幕僚長 D-36（2026-09-16）：手機直向副標 11px＋左右內距 2px（S13 實測 390／360 寬不換行）。 */
@media (orientation: portrait) {
  .kp { padding-left: 2px; padding-right: 2px; }
  .kp-sub { font-size: 11px; }
}

/* ---- 插槽用容器 ---- */
.slot-block { margin-bottom: 10px; }
.overlay-root:empty { display: none; }

/* ---- 版面切換：橫向（iPad）左右兩欄；直向（手機）抽屜 ---- */
@media (orientation: landscape) {
  .shell { flex-direction: row; }
  .leftcol { flex: 1 1 60%; min-width: 0; position: relative; }
  /* D-18：iPad 橫向維持原本「貼在方塊右上角」的浮層設計（相對 .leftcol 定位，
     視覺上落在方塊區右上角一帶；iPad 空間充裕，量測結果無重疊）。 */
  .hint-slot {
    position: absolute; right: 6%; top: 10%; left: auto; z-index: 5;
    padding: 0; justify-content: flex-end;
  }
  .hint-slot > * { margin: 0; }
  /* 幕僚長修正（2026-09-15）：橫向時抽屜固定展開、占滿整欄高度，只讓 .cpanel 捲動；
     原本 .drawer.expanded 的 56vh 上限在橫向仍生效，面板被截在半高。 */
  .drawer, .drawer.expanded {
    flex: 1 1 40%; max-height: none; overflow: hidden;
    border-left: 1px solid #e2e2e2; background: #fafbfc;
  }
  .drawer .handle-tap { display: none; }
  .drawer .ctabs, .drawer:not(.expanded) .ctabs { display: flex; }
  .drawer .cpanel, .drawer:not(.expanded) .cpanel { display: block; overflow-y: auto; }
}

/* 幕僚長修正 D-18b（2026-09-15）：手機直向時方塊區保底高度，不被提示卡與抽屜擠扁；
   改由抽屜讓出空間（抽屜可縮、內容區自行捲動）。橫向維持原本兩欄版面。 */
@media (orientation: portrait) {
  .leftcol { flex: 1 0 auto; }
  .cube-scene { flex: 1 0 auto; min-height: 210px; overflow: hidden; }
  .drawer, .drawer.expanded { flex: 0 1 auto; }
}

/* src/ui/demo.css — 提示浮層與示範分頁樣式（game-spec.md §9.1、§9.4、§2.3、§2.4） */
/* 依分派單 T-001 S8c（X-7 空殼移交後由本段改寫）。
   共用類別沿用 src/ui/styles.css 既有的 .ctl（含 .accent）按鈕樣式（≥44×44px）；
   本檔只補提示／示範專屬的版面與顏色，不重複定義按鈕基礎樣式。 */

/* ---- 提示浮層（hint 插槽；方塊區右上角） ---- */
.hint-prompt {
  max-width: min(70vw, 240px);
  padding: 8px 12px;
  border-radius: 10px;
  background: rgba(255, 255, 255, .92);
  border: 1px solid #ddd;
  font-size: 12px;
  color: #777;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
}

.hint-card, .wait-card {
  position: relative;
  max-width: min(78vw, 260px);
  padding: 10px 30px 10px 12px;
  border-radius: 12px;
  background: #fff;
  border: 1.5px solid #0a6cff;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .14);
  font-size: 12.5px;
  line-height: 1.5;
}

.wait-card { border-color: #999; padding-right: 12px; text-align: center; }
.wait-msg { color: #444; margin-bottom: 6px; }
.wait-card .ctl { margin-top: 6px; width: 100%; }

/* S11／B-3：可點範圍放大到 44×44（CLAUDE.md §3 第 4 條），視覺上仍是小的 ×；
   卡片右側內距同步加寬，避免 × 蓋住文字。 */
.hint-card { padding-right: 44px; }
.hint-close {
  position: absolute; top: 0; right: 0;
  min-width: 44px; min-height: 44px;
  border-radius: 999px; border: none; background: transparent;
  font-size: 18px; line-height: 1; color: #999; cursor: pointer;
}
.hint-move { font-size: 16px; font-weight: 700; color: #0a3b8f; margin-bottom: 4px; }
.hint-explain { color: #333; margin-bottom: 6px; }
.hint-note { font-size: 11px; color: #999; }
.hint-error, .demo-error {
  border-color: #d0332f; color: #8a1f1c; background: #fdeceb;
}

.solver-notice {
  padding: 8px 10px; border-radius: 8px; margin-bottom: 8px;
  background: #fff3cd; color: #8a6100; border: 1px solid #f0c96a;
  font-size: 12.5px; line-height: 1.4;
}

.progress-bar {
  height: 6px; border-radius: 999px; background: #eee; overflow: hidden; margin-bottom: 6px;
}
.progress-fill { height: 100%; background: #0a6cff; transition: width .15s linear; }

/* ---- 示範分頁 ---- */
.demo-root { display: flex; flex-direction: column; gap: 10px; }

.demo-kind-row { display: flex; gap: 8px; }
.demo-kind-btn { flex: 1; font-size: 13px; }
.demo-kind-btn.on { border-color: #0a6cff; background: #eaf2ff; color: #0a3b8f; font-weight: 700; }

.demo-pick { display: flex; flex-direction: column; gap: 8px; }
.demo-note { font-size: 12.5px; color: #555; line-height: 1.5; }
.demo-note-sub { color: #888; font-size: 11.5px; }
.demo-error { padding: 8px 10px; border-radius: 8px; border-width: 1px; border-style: solid; }

.demo-player { display: flex; flex-direction: column; gap: 8px; }
.demo-header { font-size: 15px; font-weight: 700; }
.demo-progress { font-size: 12px; color: #777; font-variant-numeric: tabular-nums; }
.demo-explain { font-size: 12.5px; color: #333; background: #f2f6ff; border-radius: 8px; padding: 6px 10px; }

.token-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.token-row { display: flex; gap: 6px; padding: 2px; }
.token-chip {
  flex: 0 0 auto; min-width: 40px; padding: 4px 6px; border-radius: 8px;
  border: 1.5px solid #ddd; text-align: center; opacity: .55;
}
.token-chip.done { opacity: .35; }
.token-chip.next { opacity: 1; border-color: #0a6cff; background: #eaf2ff; box-shadow: 0 0 0 2px rgba(10, 108, 255, .18); }
.token-move { font-size: 14px; font-weight: 700; }
.token-step { font-size: 9.5px; color: #777; white-space: nowrap; }

.pause-card {
  padding: 10px 12px; border-radius: 10px; background: #eaf2ff; border: 1.5px solid #0a6cff;
  display: flex; flex-direction: column; gap: 8px;
}
.pause-msg { font-size: 12.5px; color: #0a3b8f; line-height: 1.5; }

.demo-controls { display: flex; gap: 6px; flex-wrap: wrap; }
.demo-controls .ctl { flex: 1 1 auto; min-width: 44px; font-size: 12.5px; padding: 0 8px; }

.demo-speed-row { display: flex; gap: 6px; }
.speed-btn { flex: 1; font-size: 12.5px; }
.speed-btn.on { border-color: #0a6cff; background: #eaf2ff; color: #0a3b8f; font-weight: 700; }

.segment-list { display: flex; flex-direction: column; gap: 6px; }
.segment-row {
  min-height: 44px; padding: 8px 10px; border-radius: 10px; border: 1.5px solid #e2e2e2;
  cursor: pointer; display: flex; flex-direction: column; gap: 3px; justify-content: center;
}
.segment-row.done { opacity: .6; }
.segment-row.skip { opacity: .5; }
.segment-row.current { border-color: #0a6cff; background: #f5f9ff; }
.segment-row.future { opacity: .55; }
.seg-name { font-size: 13px; font-weight: 700; }
.seg-desc { font-size: 11.5px; color: #555; line-height: 1.4; }
.seg-steps { font-size: 11px; color: #0a6cff; font-weight: 700; }
.seg-note { font-size: 11px; color: #999; }

.formula-block {

}

/* src/ui/overlay.css — 完成畫面、最佳紀錄徽章、首次教學與記號小教室卡片樣式 */
/* 依分派單 T-001 S8d（game-spec.md §6.3、§6.4、§11.3、§11.4）。 */
/*
  本檔管的兩個插槽：
    [data-slot="overlay"]      置中卡片（完成畫面；遊戲畫面上方加半透明遮罩，§11.4）
    [data-slot="lesson-card"]  學習面板內的教學／記號小教室卡片（不加遮罩、不蓋方塊區，§11.3）
    [data-slot="lesson-button"] 面板頂列／手把列的「記號說明」按鈕（§11.2、§11.3）

  覆寫說明：`.lesson-card` 原本在 src/ui/styles.css（S8a）是 position:absolute 覆蓋整個
  #learnDrawer（含手把列與分頁列），但 #learnDrawer 本身沒有設 position，會讓卡片以 #app
  為定位基準蓋住整個畫面（含方塊區），違反「不蓋住方塊區」。本檔改用一般文件流（flex 子項），
  並用 order 把卡片排在手把列之後、分頁列之前，不需要修改 styles.css／index.template.html
  （僅有的兩個檔案 S8d 不可碰）。

  卡片與分頁內容的關係（§11.3）：只有記號小教室（L 步，無論在首次教學中或「記號說明」
  重開）才由 tutorial.js 把 .ctabs／#panelControls／#panelDemo 設為 hidden、卡片獨佔面板；
  一般教學步（T0～T4）卡片與目前分頁內容並存（卡片在上、分頁內容在下可捲動），因為 T2
  明確要玩家去看「操作」分頁的按鈕，見 tutorial.js 的 syncPanelVisibilityForStep 與
  S8d 回報「未預期發現」。
*/

/* ---- 完成畫面（overlay 插槽；置中卡片＋半透明遮罩，§11.4） ---- */
.overlay-mask {
  position: absolute; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  padding: 24px; background: rgba(20, 22, 26, .5);
}
.overlay-card {
  width: min(92vw, 380px); max-height: 84vh; overflow-y: auto;
  background: #fff; border-radius: 16px; padding: 22px 22px 20px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, .28);
  display: flex; flex-direction: column; gap: 10px;
}
.result-headline { margin: 0; font-size: 19px; font-weight: 700; }
.result-summary { margin: 0; font-size: 15px; color: #333; line-height: 1.5; }
.result-badges { display: flex; flex-wrap: wrap; gap: 8px; }
.result-note { margin: 0; font-size: 12.5px; color: #888; line-height: 1.5; }
.result-actions { margin-top: 6px; display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
/* MJ-2（D-24）：完成畫面的本機最佳紀錄 */
.result-best { margin: 0; font-size: 13px; color: #555; line-height: 1.5; font-variant-numeric: tabular-nums; }

/* 沿用 styles.css 的 .badge（提示徽章）外觀，另加兩個色調變化 */
.badge.badge-demo { background: #e7f0ff; color: #0a3b8f; border-color: #a9c8ff; }
.badge.badge-new { background: #e8f9ee; color: #106b3a; border-color: #8fdcae; }

/* ---- D-17：示範中的完成摘要卡（掛在 .cube-scene 上緣，不遮擋示範播放器操作） ---- */
/* 比照 styles.css 的 .hint-slot 作法：外層 pointer-events:none，只有卡片本身可互動
   （這裡卡片沒有按鈕，純資訊，但保留同款寫法以防日後加互動元素）。 */
.demo-result-slot {
  position: absolute; left: 4%; right: 4%; top: 3%; z-index: 6;
  display: flex; justify-content: center; pointer-events: none;
}
.demo-result-slot > * { pointer-events: auto; }
.demo-result-card {
  max-width: min(86vw, 320px); padding: 8px 14px; border-radius: 10px;
  background: rgba(255, 255, 255, .96); border: 1.5px solid #0a6cff;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .14); text-align: center;
}
.demo-result-headline { font-size: 13.5px; font-weight: 700; color: #0a3b8f; }
.demo-result-summary { font-size: 12px; color: #444; margin-top: 2px; }

/* ---- 「記號說明」按鈕（lesson-button 插槽） ---- */
.notation-help-btn { white-space: nowrap; }

/* ---- 教學／記號小教室卡片（lesson-card 插槽） ---- */
/* #learnDrawer 的手把列排最前面，卡片排在它之後、分頁列（預設 order:0）之前，
   這樣卡片和分頁列並存時（一般教學步）卡片在上，鍵盤在下可捲動，不會互相蓋住。 */
#learnDrawer .drawer-handle { order: -2; }
.lesson-card {
  position: static; z-index: auto; order: -1;
  flex: 0 0 auto; max-height: 46vh; min-height: 0; overflow-y: auto;
  background: #fff; padding: 14px 16px 16px;
  display: flex; flex-direction: column; gap: 8px;
  border-bottom: 1px solid #eee;
}
.lesson-meta { font-size: 12px; color: #888; }
.lesson-meta-primary { font-weight: 600; color: #666; }
.lesson-meta-secondary { color: #0a6cff; font-weight: 700; }
.lesson-title { margin: 2px 0 0; font-size: 16px; font-weight: 700; }
.lesson-body { margin: 0; font-size: 14px; line-height: 1.65; color: #222; }
.lesson-explain {
  margin: 0; font-size: 13.5px; line-height: 1.6; color: #0a3b8f;
  background: #eef3ff; border: 1px solid #cfe0ff; border-radius: 10px; padding: 10px 12px;
}
.lesson-actions {
  margin-top: auto; padding-top: 8px; display: flex; flex-wrap: wrap; gap: 8px;
}
.lesson-btn { flex: 0 0 auto; }
.lesson-next { order: 5; }
.lesson-skip-all, .lesson-close { order: 6; margin-left: auto; }

<div id="app" class="app">
  <div class="shell">
    <div class="leftcol">
      <div class="statusbar" id="statusbar">
        <div class="stat"><span class="k" id="hudTimeLabel"></span><span class="v" id="timerVal">0:00.0</span></div>
        <div class="stat">
          <span class="k" id="hudMovesLabel"></span>
          <span class="v-row"><span class="v" id="moveVal">0</span><button type="button" class="qtm-note-btn" id="qtmNoteBtn" aria-expanded="false">?</button></span>
        </div>
        <span class="badge" id="hintBadge" hidden></span>
      </div>
      <div class="qtm-note-line" id="qtmNoteLine" hidden></div>
      <div class="cube-scene">

      </div>
      <!-- D-18：手機直向時提示浮層搬到方塊區與操作列之間的一般文件流（絕不會蓋住
           方塊），iPad 橫向則用 styles.css 的 landscape 媒體查詢改回貼在方塊右上角
           （見 styles.css `.hint-slot` 的說明）。 -->
      <div class="hint-slot" data-slot="hint"></div>
      <div class="scramble-line" id="scrambleLine" hidden></div>
      <div class="controlbar" id="controlbar">
        <button class="ctl" type="button" id="btnScramble"></button>
        <button class="ctl" type="button" id="btnUndo"></button>
        <button class="ctl" type="button" id="btnRedo"></button>
        <button class="ctl" type="button" id="btnReset"></button>
        <span class="slot-inline" data-slot="hint-button"></span>
        <button class="ctl accent" type="button" id="btnDemoOpen"></button>
      </div>
    </div>
    <div class="drawer" id="learnDrawer">
      <div class="drawer-handle">
        <span class="handle-tap" id="handleTap">
          <span class="drawer-label" id="drawerLabel"></span>
          <span class="bar" aria-hidden="true"></span>
        </span>
        <span class="handle-tools">
          <span class="slot-inline" data-slot="lesson-button"></span>
          <button type="button" class="switch" id="faceLabelToggle" role="switch" aria-checked="false"></button>
        </span>
      </div>
      <div class="ctabs" role="tablist">
        <button type="button" class="ctab" id="tabControls" role="tab"></button>
        <button type="button" class="ctab" id="tabDemo" role="tab"></button>
      </div>
      <div class="cpanel" id="panelControls" data-cpanel="controls" role="tabpanel">
        <div class="keypad" id="keypad" aria-label="記號鍵盤"></div>
      </div>
      <div class="cpanel" id="panelDemo" data-cpanel="demo" role="tabpanel" hidden>
        <div class="slot-block" data-slot="solver-status"></div>
        <div class="slot-block" data-slot="demo"></div>
      </div>
      <div class="lesson-card" data-slot="lesson-card" hidden></div>
    </div>
  </div>
  <div class="overlay-root" data-slot="overlay"></div>
</div>

window.SOLVER_WORKER_SRC = "(function () {\n\"use strict\";\nvar __mods = {}, __cache = {};\nfunction __define(k, f) { __mods[k] = f; }\nfunction __resolve(from, req) {\n  var base = from.split('/'); base.pop();\n  var parts = req.split('/');\n  for (var i = 0; i < parts.length; i++) {\n    if (parts[i] === '.' || parts[i] === '') continue;\n    if (parts[i] === '..') base.pop(); else base.push(parts[i]);\n  }\n  var k = base.join('/');\n  if (__mods[k]) return k;\n  if (__mods[k + '.js']) return k + '.js';\n  if (__mods[k + '/index.js']) return k + '/index.js';\n  throw new Error('module not found: ' + req + ' (from ' + from + ')');\n}\nfunction __require(k) {\n  if (__cache[k]) return __cache[k].exports;\n  var m = { exports: {} }; __cache[k] = m;\n  __mods[k](m, m.exports, function (req) { return __require(__resolve(k, req)); });\n  return m.exports;\n}\n__define(\"engine/rng.js\", function (module, exports, require) {\n// src/engine/rng.js — seeded RNG（xorshift32）\n//\n// 依據：game-spec.md §5「打亂規則」。演算法與 docs/spike/code/solver.js 的 makeRng 相同，\n// 純函數、無外部狀態；同 seed 必得同亂數序列。engine／solver 一律透過本檔取得亂數，\n// 不得使用瀏覽器內建的非決定性亂數函式（CLAUDE.md §3 第 2 條）。\n'use strict';\n\n/**\n * 建立一個 xorshift32 亂數產生器。\n * @param {number} seed - 32 位元無號整數（0–4294967295）；0 時改用固定種子 0x9e3779b9。\n * @returns {() => number} 每次呼叫回傳一個 [0, 1) 之間的浮點數。\n */\nfunction makeRng(seed) {\n  var state = (seed >>> 0) || 0x9e3779b9;\n  return function () {\n    state ^= state << 13;\n    state >>>= 0;\n    state ^= state >>> 17;\n    state ^= state << 5;\n    state >>>= 0;\n    return state / 4294967296;\n  };\n}\n\nmodule.exports = { makeRng: makeRng };\n\n});\n__define(\"engine/cube.js\", function (module, exports, require) {\n// src/engine/cube.js — 方塊模型：貼紙表示法、36 個記號、24 種朝向\n//\n// 依據：game-spec.md §1（名詞與記號）、§2.1（QTM 計步）、§2.4（白話說明）、\n// §3.1–§3.3（狀態模型）、§9.2 第 3 點（手勢對應）。\n//\n// 設計原則（CLAUDE.md §3）：\n//   - 純函數，不讀取時間、DOM、亂數或全域狀態；所有轉動的貼紙置換皆由 3D 幾何推導，\n//     不手抄轉動表。\n//   - 54 格貼紙以面序 U R F D L B（0–5）展開，每面 9 格由左上到右下 ;\n      else perm[i] = i;\n    }\n    FACE_PERM.push(perm);\n  }\n})();\n\nvar SOLVED_FACELETS = 'UUUUUUUUURRRRRRRRRFFFFFFFFFDDDDDDDDDLLLLLLLLLBBBBBBBBB';\n\n/**\n * 在貼紙層級套用一個外層轉動（測試與對照用）。\n * @param {string|Array} s - 54 格字串或陣列（陣列元素可為任意值）\n * @param {number} m - 轉動編號 0..17\n * @returns {string|Array} 與輸入同型別的新值（不修改輸入）\n */\nfunction applyMoveFacelets(s, m) {\n  var isStr = typeof s === 'string';\n  var arr = isStr ? s.split('') : Array.prototype.slice.call(s);\n  var f = (m / 3) | 0, pw = (m % 3) + 1;\n  for (var k = 0; k < pw; k++) {\n    var out = new Array(54);\n    for (var i = 0; i < 54; i++) out[FACE_PERM[f][i]] = arr[i];\n    arr = out;\n  }\n  return isStr ? arr.join('') : arr;\n}\n\n// ---------------------------------------------------------------------------\n// 2. cubie 表示法與貼紙互轉\n// ---------------------------------------------------------------------------\nvar CORNER_NAMES = ['URF', 'UFL', 'ULB', 'UBR', 'DFR', 'DLF', 'DBL', 'DRB'];\nvar EDGE_NAMES = ['UR', 'UF', 'UL', 'UB', 'DR', 'DF', 'DL', 'DB', 'FR', 'FL', 'BL', 'BR'];\nfunction cubiePos(name) {\n  var p = [0, 0, 0];\n  for (var k = 0; k < name.length; k++) {\n    var n = NORMAL[name[k]];\n    p[0] += n[0]; p[1] += n[1]; p[2] += n[2];\n  }\n  return p;\n}\nvar CORNER_FACELET = CORNER_NAMES.map(function (nm) {\n  var p = cubiePos(nm);\n  return nm.split('').map(function (c) { return stickerIndex(p, NORMAL[c]); });\n});\nvar EDGE_FACELET = EDGE_NAMES.map(function (nm) {\n  var p = cubiePos(nm);\n  return nm.split('').map(function (c) { return stickerIndex(p, NORMAL[c]); });\n});\n\n/** 已復原的 cubie 狀態（新物件） */\nfunction newCube() {\n  var c = { cp: new Int8Array(8), co: new Int8Array(8), ep: new Int8Array(12), eo: new Int8Array(12) };\n  for (var i = 0; i < 8; i++) c.cp[i] = i;\n  for (var j = 0; j < 12; j++) c.ep[j] = j;\n  return c;\n}\nfunction copyCube(src, dst) {\n  dst = dst || newCube();\n  dst.cp.set(src.cp); dst.co.set(src.co); dst.ep.set(src.ep); dst.eo.set(src.eo);\n  return dst;\n}\nfunction -----------------\n// 4. 各段完成判定（§8.3；T-LBL-08 使用）\n//    每個函式：(stickers54, config) → boolean；只看傳入狀態，不看產生過程。\n// ---------------------------------------------------------------------------\n\nfunction holdDone(st, config) {\n  return centerColor(st, 'U') === config.firstLayerColor;\n}\n\nfunction crossDone(st, config) {\n  if (!holdDone(st, config)) return false;\n  return TOP_EDGE_SLOTS.every(function (slot) { return edgeSolved(st, slot); });\n}\n\nfunction cornersDone(st, config) {\n  if (!crossDone(st, config)) return false;\n  if (!faceAll(st, 'U', config.firstLayerColor)) return false;\n  return SIDE_FACES.every(function (f) { return sideRowSolved(st, f, 0); });\n}\n\nfunction middleDone(st, config) {\n  if (centerColor(st, 'D') !== config.firstLayerColor) return false;\n  return firstTwoLayersDown(st, config.firstLayerColor);\n}\n\nfunction yellowCrossDone(st, config) {\n  return middleDone(st, config) && uEdgesAre(st, centerColor(st, 'U'));\n}\n\nfunction yellowFaceDone(st, config) {\n  return middleDone(st, config) && faceAll(st, 'U', centerColor(st, 'U'));\n}\n\nfunction yellowCornersDone(st, config) {\n  if (!yellowFaceDone(st, config)) return false;\n  return SIDE_FACES.every(function (f) {\n    var b = faceBase(f);\n    return st[b] === st[b + 4] && st[b + 2] === st[b + 4];\n  });\n}\n\nfunction yellowEdgesDone(st) {\n  return cube.isSolved(st);\n}\n\nvar STAGE_CHECKS = {\n  hold: holdDone,\n  cross: crossDone,\n  corners: cornersDone,\n  middle: middleDone,\n  yellowCross: yellowCrossDone,\n  yellowFace: yellowFaceDone,\n  yellowCorners: yellowCornersDone,\n  yellowEdges: yellowEdgesDone\n};\n\n// ---------------------------------------------------------------------------\n// 5. 輸入與設定檢查\n// ---------------------------------------------------------------------------\n\nfunction checkStickers(view) {\n  if (!Array.isArray(view) || view.length !== 54) fail('INVALID_STATE', 'LENGTH');\n  var count = [0, 0, 0, 0, 0, 0];\n  for (var i = 0; i < 54; i++) {\n    var c = view[i];\n    if (!(Number.isInteger(c) && c >= 0 && c < 6)) fail('INVALID_STATE', 'BAD_COLOR');\n    count[c]++;\n  }\n  if (count.some(function (n) { return n !== 9; })) fail('INVALID_STATE', 'BAD_COLOR');\n  var seen = {};\n  for (var f = 0; f < 6; f++) {\n    var cc = view[9 * f + 4];\n    if (seen[cc]) fail('INVALID_STATE', 'CENTER_DUPLICATE');\n    seen[cc] = true;\n  }\n}\n\nfunction isPositiveInt(n) {\n  return Number.isInteger(n) && n > 0;\n}\n\n// 讀出產生器需要的設定；格式不符回 BAD_REQUEST。\nfunction readConfig(config) {\n  if (!config || typeof config !== 'object') fail('BAD_REQUEST', 'config');\n  var fl = config.firstLayerColor;\n  if (!(Number.isInteger(fl) && fl >= 0 && fl < 6)) fail('BAD_REQUEST', 'firstLayerColor');\n  if (!Array.isArray(config.segments) || config.segments.join(',') !== SEGMENT_IDS.join(',')) {\n    fail('BAD_REQUEST', 'segments');\n  }\n  if (HEADLIGHT_FACES.indexOf(config.headlightFace) === -1) fail('BAD_REQUEST', 'headlightFace');\n  var guards = config.guards;\n  if (!guards || typeof guards !== 'object') fail('BAD_REQUEST', 'guards');\n  GUARD_KEYS.forEach(function (key) {\n    if (!isPositiveInt(guards[key])) fail('BAD_REQUEST', 'guards.' + key);\n  });\n  var algs = {};\n  FORMULA_IDS.forEach(function (id) {\n    var f = config.formulas && config.formulas[id];\n    if (!f || typeof f.alg !== 'string') fail('BAD_REQUEST', 'formulas.' + id);\n    var moves;\n    try {\n      moves = cube.parseMoves(f.alg);\n    } catch (e) {\n      fail('BAD_REQUEST', 'formulas.' + id);\n    }\n    if (moves.length === 0) fail('BAD_REQUEST', 'formulas.' + id);\n    algs[id] = moves;\n  });\n  return {\n    firstLayerColor: fl,\n    headlightFace: config.headlightFace,\n    guards: guards,\n    algs: algs\n  };\n}\n\n// ---------------------------------------------------------------------------\n// 6. 產生器本體\n// ---------------------------------------------------------------------------\n\nfunction newLoopStats() {\n  var s = {};\n  GUARD_KEYS.forEach(function (k) { s[k] = 0; });\n  return s;\n}\n\nfunction runGenerator(view, config) {\n  checkStickers(view);\n  var cfg = readConfig(config);\n  var W = cfg.firstLayerColor;\n  var guards = cfg.guards;\n  var algs = cfg.algs;\n\n  var st = view.slice();       // 虛擬方塊（目前的 view 狀態）\n  var tokens = [];\n  var segments = [];\n  var seg = null;\n  var loops = newLoopStats();  // 本局各迴圈的實際次數（每段／每角取最大）\n\n  function applyToken(t) {\n    st = cube.applyMove(st, t);\n    tokens.push(t);\n  }\n\n  // 輸出一組記號成為一個 part。\n  //   rotate：若上一個 part 也是 rotate 且緊接在後，併進同一個 part 再合併同字母旋轉。\n  //   setup：每個記號各自成一個 part（§8.2「單一轉動」）。\n  //   formula：整條公式一個 part。\n  function emit(list, kind, formulaId) {\n    if (list.length === 0) return;\n    if (kind === 'setup') {\n      list.forEach(function (t) {\n        var start = tokens.length;\n        applyToken(t);\n        seg.parts.push({ start: start, end: tokens.length, kind: 'setup', formula: null });\n      });\n      return;\n    }\n    if (kind === 'rotate') {\n      var last = seg.parts.length ? seg.parts[seg.parts.length - 1] : null;\n      var start = tokens.length;\n      list.forEach(applyToken);\n      if (last && last.kind === 'rotate' && last.end === start) {\n        // 狀態已照原記號套用；合併只改寫記號，不改變結果（同字母旋轉可交換合併）。\n        var merged = mergeRotations(tokens.slice(last.start));\n        tokens.length = last.start;\n        merged.forEach(function (t) { tokens.push(t); });\n        last.end = tokens.length;\n        if (last.end === last.start) seg.parts.pop();\n      } else {\n        var mergedNew = mergeRotations(tokens.slice(start));\n        tokens.length = start;\n        mergedNew.forEach(function (t) { tokens.push(t); });\n        if (tokens.length > start) {\n          seg.parts.push({ start: start, end: tokens.length, kind: 'rotate', formula: null });\n        }\n      }\n      return;\n    }\n    var fStart = tokens.length;\n    list.forEach(applyToken);\n    seg.parts.push({ start: fStart, end: tokens.length, kind: 'formula', formula: formulaId });\n  }\n\n  function formula(id) {\n    emit(algs[id], 'formula', id);\n  }\n\n  // 找出 base 轉 0–3 次中，最少幾次能讓 pred 成立；都不成立 → LBL_STUCK。\n  function turnsUntil(base, pred) {\n    var b = st;\n    for (var n = 0; n < 4; n++) {\n      if (pred(b)) return n;\n      b = cube.applyMove(b, base);\n    }\n    return fail('LBL_STUCK', 'turnsUntil ' + base);\n  }\n\n  function adjust(base, pred, kind) {\n    emit(turnTokens(base, turnsUntil(base, pred)), kind);\n  }\n\n  function mustEdge(s, c1, c2) {\n    var e = locateEdge(s, c1, c2);\n    if (!e) fail('INVALID_STATE', 'EDGE_UNKNOWN');\n    return e;\n  }\n\n  function mustCorner(s, colors) {\n    var c = locateCorner(s, colors);\n    if (!c) fail('INVALID_STATE', 'CORNER_UNKNOWN');\n    return c;\n  }\n\n  function begin(id) {\n    seg = { id: id, start: tokens.length, end: tokens.length, qtm: 0, parts: [] };\n    segments.push(seg);\n  }\n\n  function end() {\n    seg.end = tokens.length;\n    seg.qtm = sumQtm(tokens, seg.start, seg.end);\n    if (!STAGE_CHECKS[seg.id](st, cfg)) fail('LBL_STUCK', 'check:' + seg.id);\n  }\n\n  // ---- 0 hold：白色中心轉到上面 ----\n  begin('hold');\n  var whiteFace = faceOfColor(st, W);\n  if (whiteFace === null) fail('INVALID_STATE', 'BAD_COLOR');\n  if (HOLD_ROTATION[whiteFace]) emit([HOLD_ROTATION[whiteFace]], 'rotate');\n  end();\n\n  // ---- 1 cross：白色十字（白在上）----\n  begin('cross');\n  (function () {\n    function sideDone(s, side) {\n      var e = mustEdge(s, W, centerColor(s, side));\n      return e.slot === 'U' + side && e.flip === 0;\n    }\n    function allDone() {\n      return SIDE_FACES.every(function (side) { return sideDone(st, side); });\n    }\n    var iter = 0;\n    while (!allDone()) {\n      if (iter >= guards.cross) fail('LBL_STUCK', 'cross');\n      iter++;\n      var side = SIDE_FACES.filter(function (f) { return !sideDone(st, f); })[0];\n      var target = centerColor(st, side);\n      // 1. y 對位：把該側面轉到 F。\n      adjust('y', function (b) { return centerColor(b, 'F') === target; }, 'rotate');\n      var fc = centerColor(st, 'F');\n      var e = mustEdge(st, W, fc);\n      if (e.slot.charAt(0) === 'U') {\n        // 2a. 在頂層（位置或方向錯）：轉所在側面 180°，帶到底層。\n        emit([e.slot.charAt(1) + '2'], 'setup');\n      } else if (e.slot.charAt(0) !== 'D') {\n        // 2b. 在中層：X 取位置名稱第一個字母，試 X、X'，選第一個能帶到底層的 t，輸出 t D t⁻¹。\n        var x = e.slot.charAt(0);\n        var t = [x, x + \"'\"].filter(function (m) {\n          return mustEdge(cube.applyMove(st, m), W, fc).slot.charAt(0) === 'D';\n        })[0];\n        if (!t) fail('LBL_STUCK', 'cross');\n        emit([t, 'D', cube.inverse(t)], 'setup');\n      }\n      // 3. D 調整，讓它到 DF。\n      adjust('D', function (b) { return mustEdge(b, W, fc).slot === 'DF'; }, 'setup');\n      // 4. 白色朝下 → crossDown；白色朝前 → crossFlip。\n      if (st[EDGE_STICKERS.DF[0]] === W) formula('crossDown');\n      else formula('crossFlip');\n    }\n    loops.cross = iter;\n  })();\n  end();\n\n  // ---- 2 corners：白色角塊（白在上）----\n  begin('corners');\n  (function () {\n    function targetColors(s, pair) {\n      return [W, centerColor(s, pair[0]), centerColor(s, pair[1])];\n    }\n    // 某目標角（三色）是否已在頂層正確位置。\n    function targetSolved(s, colors) {\n      var c = mustCorner(s, colors);\n      return c.slot.charAt(0) === 'U' && c.twist === 0 && cornerSolved(s, c.slot);\n    }\n    function firstTodo() {\n      for (var i = 0; i < CORNER_TARGET_PAIRS.length; i++) {\n        var cs = targetColors(st, CORNER_TARGET_PAIRS[i]);\n        if (!targetSolved(st, cs)) return cs;\n      }\n      return null;\n    }\n    var iter = 0;\n    var cs = firstTodo();\n    while (cs) {\n      if (iter >= guards.corners) fail('LBL_STUCK', 'corners');\n      iter++;\n      // 1. y 對位：目標槽（兩側中心 cs[1]、cs[2]）轉到 UFR。\n      adjust('y', function (b) {\n        return centerColor(b, 'F') === cs[1] && centerColor(b, 'R') === cs[2];\n      }, 'rotate');\n      // 2. 角塊在頂層：不在 UFR → y 帶過去、拿下來、y 轉回；在 UFR 但方向錯 → 拿下來。\n      var c = mustCorner(st, cs);\n //     注意：主執行緒上的計算是同步的，watchdog 無法中斷一次正在進行的計算；真正的計算量上限仍是
//     params.solver 的搜尋節點上限（NODE_LIMIT）。watchdog 保護的是「job 排了程卻一直沒有結果」的情形。
//
// deps（全部由外部注入，Node 測試可用假 Worker 與假時鐘）：
//   createWorker(handlers) → {postMessage(msg), terminate()}
//       handlers = {onMessage(data), onError(err)}；建不起來就丟例外（→ mainThread）。
//       省略時使用 defaultCreateWorker（瀏覽器：以 window.SOLVER_WORKER_SRC 建 Blob Worker）。
//   setTimer(fn, ms) → handle、clearTimer(handle)、now() → 毫秒
//   engine    src/engine/index.js（solverInput、isSolvedNow、viewStickers、toHome、toView、applyMove、qtmCost、kind）
//   params    GAME_DATA.params（本檔讀 params.solver；D-3：init 與 solve 一律傳入 params.solver）
//   lblConfig GAME_DATA.lbl（lbl.json 全文）
//   onStatus(status)  狀態改變時呼叫（可省略）
//   solvers   {twophase, lbl}（可省略；省略時 require 主 bundle 內的 solver 模組，供主執行緒退回使用）
//
// 回傳的 action 只有下列形式（UI 直接 dispatch；reducer 拒絕時丟棄即可）：
//   {type:'HINT_READY',  payload:{version, tokens, source, planQtm}}
//   {type:'HINT_FAILED', payload:{version, code}}
//   {type:'DEMO_READY',  payload:{version, tokens, segments}}
//   {type:'DEMO_FAILED', payload:{version, code}}
'use strict';

// 主 bundle 也包含 solver 模組（ADR-001 §2.6），供主執行緒退回與層先法退回使用
var defaultTwophase = require('../solver/twophase.js');
var defaultLbl = require('../solver/lbl.js');

var STATES = ['booting', 'building', 'ready', 'mainThread', 'failed'];

// 失敗碼 → 文案鍵（texts.json）。UI 依此顯示，不要自己依字串分支。
// 不在表內的碼依 D-5 一律視為非法狀態。
var FAILURE_TEXT_KEYS = {
  CANCELLED: null,
  ALREADY_SOLVED: null,
  NODE_LIMIT: 'demo.suggestUnavailable',
  TIMEOUT: 'demo.suggestUnavailable',
  SOLVER_FAILED: 'demo.suggestUnavailable',
  INVALID_STATE: 'error.invalidState',
  LBL_STUCK: 'error.generic',
  BAD_REQUEST: 'error.generic',
  NOT_READY: 'error.generic',
  INTERNAL: 'error.generic'
};

/**
 * 失敗碼對應的文案鍵（'demo.suggestUnavailable'｜'error.invalidState'｜'error.generic'｜null）。
 * 'demo.suggestUnavailable' 表示應提供「改看層先法示範」按鈕（§9.6）。
 */
function failureTextKey(code) {
  if (Object.prototype.hasOwnProperty.call(FAILURE_TEXT_KEYS, code)) return FAILURE_TEXT_KEYS[code];
  return 'error.invalidState';
}

/**
 * 瀏覽器預設的 Worker 建立方式：以 window.SOLVER_WORKER_SRC 產生 Blob URL（ADR-001 §2.5）。
 * 任何一步不可用都丟例外，讓 client 轉 mainThread。
 */
function defaultCreateWorker(handlers) {
  var g = typeof window !== 'undefined' ? window : null;
  if (!g || typeof g.SOLVER_WORKER_SRC !== 'string' || typeof g.Worker !== 'function' ||
      typeof g.Blob !== 'function' || !g.URL || typeof g.URL.createObjectURL !== 'function') {
    throw new Error('solver-client：此環境無法建立 Worker');
  }
  var url = g.URL.createObjectURL(new g.Blob([g.SOLVER_WORKER_SRC], { type: 'text/javascript' }));
  var w;
  try {
    w = new g.Worker(url);
  } catch (e) {
    g.URL.revokeObjectURL(url);
    throw e;
  }
  // n-7：Worker 建立後就釋放 Blob URL，不必等到 terminate。保守起見在「Worker 第一次回訊息
  // （此時腳本已載入並開始執行）或出錯」時釋放，而不是 new Worker 之後立刻釋放：依 HTML 規格
  // 立刻釋放應該也可以，但 iPad Safari 的實際行為未實測（UNKNOWN），所以選擇較晚、較保守的時間點。
  var revoked = false;
  function revokeOnce() {
    if (revoked) return;
    revoked = true;
    g.URL.revokeObjectURL(url);
  }
  w.onmessage = function (e) {
    revokeOnce();
    handlers.onMessage(e.data);
  };
  w.onerror = function (e) {
    revokeOnce();
    if (e && typeof e.preventDefault === 'function') e.preventDefault();
    handlers.onError(e);
  };
  return {
    postMessage: function (msg) { w.postMessage(msg); },
    terminate: function () {
      w.terminate();
      revokeOnce();
    }
  };
}

function createSolverClient(deps) {
  if (!deps || !deps.engine || !deps.params || !deps.params.solver || !deps.lblConfig) {
    throw new Error('solver-client：缺少 engine、params.solver 或 lblConfig');
  }
  if (typeof deps.setTimer !== 'function' || typeof deps.clearTimer !== 'function' || typeof deps.now !== 'function') {
    throw new Error('solver-client：缺少 setTimer、clearTimer 或 now');
  }
  var engine = deps.engine;
  var solverParams = deps.params.solver;
  var lblConfig = deps.lblConfig;
  var createWorker = deps.createWorker || defaultCreateWorker;
  var setTimer = deps.setTimer;
  var clearTimer = deps.clearTimer;
  var now = deps.now;
  var onStatus = typeof deps.onStatus === 'function' ? deps.onStatus : function () {};
  var twophase = (deps.solvers && deps.solvers.twophase) || defaultTwophase;
  var lbl = (deps.solvers && deps.solvers.lbl) || defaultLbl;
  var TOTAL_STEPS = twophase.PROGRESS_LABELS ? twophase.PROGRESS_LABELS.length : 6;

  // ---- 內部狀態（UI 狀態，不進 engine state；X-3） ----
  var started = false;
  var mode = 'booting';
  var step = 0;
  var initMs = null;       // 建表耗時（Worker 或主執行緒；僅供顯示與實機量測）
  var initStartAt = null;
  var worker = null;       // 目前的 Worker 包裝；null 代表沒有
  var initId = null;
  var initTimer = null;
  var nextId = 0;
  var inFlight = null;     // {id, job, timer}：Worker 內唯一的求解請求
  var queue = [];          // 等待送出的 job
  var current = null;      // 呼叫端正在等待的 job（cancel 的對象）
  var cache = new Map();   // home 字串 → 剩下的 home 記號序列
  var mainTimer = null;    // 主執行緒模式下已排程的 job 計時器；null 代表沒有

  function statusObj() {
    return {
      state: mode,
      step: step,
      total: TOTAL_STEPS,
      initMs: initMs,
      // 主執行緒模式且尚未建表：第一次求解前 UI 要先顯示 texts.solver.mainThreadNotice
      notice: mode === 'mainThread' && !twophase.isReady()
    };
  }

  function setMode(m, s) {
    mode = m;
    if (s !== undefined) step = s;
    onStatus(statusObj());
  }

  // ---- 計畫快取（§7.5） ----
  function keyOf(stickers) {
    return stickers.join('');
  }

  function cachePut(key, value) {
    if (cache.has(key)) cache.delete(key);
    cache.set(key, value);
    while (cache.size > solverParams.planCacheSize) {
      cache.delete(cache.keys().next().value);
    }
  }

  function storePlan(home, homeMoves) {
    var cur = home.slice();
    for (var i = 0; i < homeMoves.length; i++) {
      cachePut(keyOf(cur), homeMoves.slice(i));
      cur = engine.applyMove(cur, homeMoves[i]);
    }
  }

  function planQtmOf(homeMoves) {
    var sum = 0;
    for (var i = 0; i < homeMoves.length; i++) sum += engine.qtmCost(homeMoves[i]);
    return sum;
  }

  // ---- action 產生 ----
  function failAction(job, code) {
    return {
      type: job.req === 'hint' ? 'HINT_FAILED' : 'DEMO_FAILED',
      payload: { version: job.version, code: code }
    };
  }

  function actionFromPlan(job, plan) {
    if (job.req === 'hint') {
      return {
        type: 'HINT_READY',
        payload: {
          version: job.version,
          tokens: [engine.toView(job.orient, plan[0])],
          source: 'suggest',
          planQtm: planQtmOf(plan)
        }
      };
    }
    return {
      type: 'DEMO_READY',
      payload: {
        version: job.version,
        tokens: plan.map(function (m) { return engine.toView(job.orient, m); }),
        segments: null
      }
    };
  }

  // 層先法結果 → action（提示：取第一個轉動及其前面的整顆旋轉；§9.6）
  function actionFromLbl(job, r) {
    if (job.req === 'hint') {
      var tokens = [];
      for (var i = 0; i < r.tokens.length; i++) {
        tokens.push(r.tokens[i]);
        if (engine.kind(r.tokens[i]) !== 'rotation') {
          return {
            type: 'HINT_READY',
            payload: { version: job.version, tokens: tokens, source: 'lbl', planQtm: null }
          };
        }
      }
      return failAction(job, 'INTERNAL');
    }
    return {
      type: 'DEMO_READY',
      payload: { version: job.version, tokens: r.tokens.slice(), segments: r.segments }
    };
  }

  function finish(job, action) {
    if (job.done) return;
    job.done = true;
    if (job.mainWatch !== null && job.mainWatch !== undefined) {
      clearTimer(job.mainWatch);
      job.mainWatch = null;
    }
    if (current === job) current = null;
    job.resolve(action);
  }

  // ---- 主執行緒上的計算 ----
  // S13／m-3：一律回傳 action、不丟例外（例外視同 Worker 端的 INTERNAL）。
  function lblOnMain(job) {
    try {
      var parsed = twophase.fromStickerColors(job.stickers);
      if (!parsed.ok) return failAction(job, 'INVALID_STATE');
      var r = lbl.generateLbl(job.stickers.slice(), lblConfig);
      if (r.error) return failAction(job, r.error);
      return actionFromLbl(job, r);
    } catch (e) {
      return failAction(job, 'INTERNAL');
    }
  }

  // 建議解不可用時的退回（§9.6）：提示與層先法示範改在主執行緒跑層先法；建議解示範回報不可用
  function fallback(job, code) {
    if (job.done) return;
    if (job.req === 'suggest') {
      finish(job, failAction(job, code));
      return;
    }
    finish(job, lblOnMain(job));
  }

  function solveOnMain(job) {
    var parsed = twophase.fromStickerColors(job.stickers);
    if (!parsed.ok) {
      finish(job, failAction(job, 'INVALID_STATE'));
      return;
    }
    if (!twophase.isReady()) {
      var t0 = now();
      try {
        twophase.init(null, function (k) { step = k; onStatus(statusObj()); });
      } catch (e) {
        setMode('failed');
        fallback(job, 'SOLVER_FAILED');
        drainQueue();
        return;
      }
      initMs = now() - t0;
      onStatus(statusObj());
    }
    var r = twophase.solve(parsed.cube, solverParams);
    if (r.error) {
      if (r.error === 'NODE_LIMIT') fallback(job, 'NODE_LIMIT');
      else finish(job, failAction(job, 'INTERNAL'));
      return;
    }
    acceptSolve(job, r.names);
  }

  // S13／m-3：任何例外都以 INTERNAL 結束這個 job（與 Worker 路徑 onWorkerMessage 的 try/catch 一致）。
  function runOnMain(job) {
    try {
      if (job.req === 'lbl') {
        finish(job, lblOnMain(job));
      } else {
        solveOnMain(job);
      }
    } catch (e) {
      finish(job, failAction(job, 'INTERNAL'));
    }
  }

  // S13／m-3：主執行緒 job 的 watchdog（對應 Worker 路徑的 onSolveTimeout）。
  function armMainWatch(job) {
    if (job.done || (job.mainWatch !== null && job.mainWatch !== undefined)) return;
    job.mainWatch = setTimer(function () {
      job.mainWatch = null;
      if (job.done) return;
      var qi = queue.indexOf(job);
      if (qi >= 0) queue.splice(qi, 1);
      fallback(job, 'TIMEOUT');
    }, solverParams.solveTimeoutMs);
  }

  // 主執行緒模式：一次排程一個 job，讓 UI 先有機會畫出等待卡片與提示文案
  function pumpMain() {
    if (mainTimer !== null) return;
    while (queue.length > 0 && queue[0].done) queue.shift();
    if (queue.length === 0) return;
    mainTimer = setTimer(function () {
      mainTimer = null;
      try {
        var job = queue.shift();
        if (job && !job.done) runOnMain(job);
      } finally {
        pumpMain(); // S13／m-3：即使本輪出錯，也繼續處理後面的 job
      }
    }, 0);
    // 先登記排程、再登記 watchdog（真實計時器依時間排序，順序不影響；只是讓登記順序與預期執行順序一致）
    for (var i = 0; i < queue.length; i++) armMainWatch(queue[i]);
  }

  function acceptSolve(job, viewMoves) {
    if (!Array.isArray(viewMoves)) throw new Error('solver-client：moves 不是陣列');
    var homeMoves = viewMoves.map(function (m) { return engine.toHome(job.orient, m); });
    storePlan(job.home, homeMoves);
    if (job.done) return; // 已取消：結果只進快取，不交給呼叫端
    if (homeMoves.length === 0) {
      finish(job, failAction(job, 'ALREADY_SOLVED'));
      return;
    }
    finish(job, actionFromPlan(job, homeMoves));
  }

  // ---- Worker ----
  function killWorker() {
    if (initTimer !== null) {
      clearTimer(initTimer);
      initTimer = null;
    }
    if (inFlight && inFlight.timer !== null) clearTimer(inFlight.timer);
    var w = worker;
    worker = null;
    initId = null;
    if (w) {
      try {
        w.terminate();
      } catch (e) {
        // 終止失敗不影響後續流程
      }
    }
  }

  function boot() {
    var w = null;
    var handlers = {
      onMessage: function (data) { if (w !== null && w === worker) onWorkerMessage(data); },
      onError: function (err) { if (w !== null && w === worker) onWorkerError(err); }
    };
    try {
      w = createWorker(handlers);
      if (!w || typeof w.postMessage !== 'function') throw new Error('solver-client：createWorker 回傳值無效');
    } catch (e) {
      w = null;
      toMainThread();
      return;
    }
    worker = w;
    initId = ++nextId;
    step = 0;
    setMode('booting', 0);
    initStartAt = now();
    initTimer = setTimer(onInitTimeout, solverParams.initTimeoutMs);
    try {
      w.postMessage({ type: 'init', id: initId, params: solverParams });
    } catch (e) {
      toMainThread();
    }
  }

  function toMainThread() {
    var orphan = inFlight;
    killWorker();
    inFlight = null;
    setMode('mainThread');
    if (orphan && !orphan.job.done) queue.unshift(orphan.job);
    pumpMain();
  }

  function toFailed() {
    killWorker();
    inFlight = null;
    setMode('failed');
    drainQueue();
  }

  function onInitTimeout() {
    initTimer = null;
    toFailed();
  }

  function onWorkerError() {
    toMainThread();
  }

  // 依目前模式處理佇列
  function drainQueue() {
    if (mode === 'ready') {
      pumpWorker();
    } else if (mode === 'mainThread') {
      pumpMain();
    } else if (mode === 'failed') {
      var jobs = queue;
      queue = [];
      for (var i = 0; i < jobs.length; i++) {
        if (jobs[i].done) continue;
        if (jobs[i].req === 'lbl') finish(jobs[i], lblOnMain(jobs[i]));
        else fallback(jobs[i], 'SOLVER_FAILED');
      }
    }
    // booting／building：等 ready 或 failed
  }

  function pumpWorker() {
    if (mode !== 'ready' || inFlight !== null || worker === null) return;
    while (queue.length > 0 && queue[0].done) queue.shift();
    if (queue.length === 0) return;
    var job = queue.shift();
    var id = ++nextId;
    var msg = job.req === 'lbl'
      ? { type: 'lbl', id: id, stickers: job.stickers, config: lblConfig }
      : { type: 'solve', id: id, stickers: job.stickers, opts: solverParams };
    inFlight = { id: id, job: job, timer: setTimer(onSolveTimeout, solverParams.solveTimeoutMs) };
    try {
      worker.postMessage(msg);
    } catch (e) {
      toMainThread();
    }
  }

  function onSolveTimeout() {
    var job = inFlight ? inFlight.job : null;
    if (inFlight) inFlight.timer = null;
    inFlight = null;
    // 終止並在背景重建 Worker（§9.6）；本次請求退回
    killWorker();
    if (job) fallback(job, 'TIMEOUT');
    boot();
  }

  function onWorkerMessage(data) {
    if (!data || typeof data !== 'object') return;
    if (initId !== null && data.id === initId) {
      if (data.type === 'progress') {
        setMode('building', data.step);
      } else if (data.type === 'ready') {
        clearTimer(initTimer);
        initTimer = null;
        initId = null;
        initMs = now() - initStartAt;
        setMode('ready', TOTAL_STEPS);
        drainQueue();
      } else if (data.type === 'error') {
        toFailed();
      }
      return;
    }
    if (inFlight === null || data.id !== inFlight.id) return; // 過期的回覆
    var job = inFlight.job;
    if (inFlight.timer !== null) clearTimer(inFlight.timer);
    inFlight = null;
    try {
      handleReply(job, data);
    } catch (e) {
      finish(job, failAction(job, 'INTERNAL')); // 回覆格式不符，不讓呼叫端永遠等待
    }
    pumpWorker();
  }

  function handleReply(job, data) {
    if (data.type === 'result' && data.kind === 'solve' && job.req !== 'lbl') {
      acceptSolve(job, data.moves);
      return;
    }
    if (data.type === 'result' && data.kind === 'lbl' && job.req === 'lbl') {
      if (!job.done) finish(job, actionFromLbl(job, data));
      return;
    }
    if (job.done) return;
    if (data.type !== 'error') {
      finish(job, failAction(job, 'INTERNAL'));
      return;
    }
    if (data.code === 'NODE_LIMIT') {
      fallback(job, 'NODE_LIMIT');
    } else if (data.code === 'NOT_READY' && !job.retried) {
      // 程式錯誤（§9.5）：重建 Worker 後重送一次
      job.retried = true;
      queue.unshift(job);
      killWorker();
      boot();
    } else if (typeof data.code === 'string' && Object.prototype.hasOwnProperty.call(FAILURE_TEXT_KEYS, data.code)) {
      finish(job, failAction(job, data.code));
    } else {
      finish(job, failAction(job, 'INVALID_STATE')); // D-5
    }
  }

  // ---- 對外介面 ----
  function start() {
    if (started) return;
    started = true;
    boot();
  }

  // S13／m-3：submit 在任何情況都回傳 Promise、不同步丟例外；否則呼叫端（hint-view／demo-player）
  // 收不到結果，state 會停在等待中，而 current 尚未設定，「取消」也無從作用。
  // 例外發生在本次 job 建立之後：結束這個 job（INTERNAL；已結束則維持原結果）並回傳它的 Promise；
  // 發生在 job 建立之前：回傳 INTERNAL 的失敗 action。
  function submit(state, req) {
    var ref = { job: null };
    try {
      return submitInner(state, req, ref);
    } catch (e) {
      var job = ref.job;
      if (job === null) {
        return Promise.resolve(failAction({ req: req, version: state ? state.version : null }, 'INTERNAL'));
      }
      var qi = queue.indexOf(job);
      if (qi >= 0) queue.splice(qi, 1);
      if (job.promise === null) return Promise.resolve(failAction(job, 'INTERNAL'));
      finish(job, failAction(job, 'INTERNAL'));
      return job.promise;
    }
  }

  function submitInner(state, req, ref) {
    if (current !== null) cancel();
    var input = engine.solverInput(state);
    var job = {
      req: req,
      stickers: input.stickers,
      version: input.version,
      orient: input.orient,
      home: state.home.slice(),
      done: false,
      retried: false,
      resolve: null,
      promise: null,
      mainWatch: null
    };
    ref.job = job;
    // D-2：已復原不送請求
    if (engine.isSolvedNow(state)) return Promise.resolve(failAction(job, 'ALREADY_SOLVED'));
    if (req !== 'lbl') {
      var plan = cache.get(keyOf(job.home));
      if (plan && plan.length > 0) return Promise.resolve(actionFromPlan(job, plan));
      if (mode === 'failed') {
        if (req === 'suggest') return Promise.resolve(failAction(job, 'SOLVER_FAILED'));
        return Promise.resolve(lblOnMain(job));
      }
    } else if (mode === 'failed') {
      return Promise.resolve(lblOnMain(job));
    }
    var p = new Promise(function (resolve) { job.resolve = resolve; });
    job.promise = p;
    current = job;
    queue.push(job);
    if (!started) start();
    else drainQueue();
    return p;
  }

  /**
   * 請求下一步提示。
   * @param {object} state - engine state（通常是剛送出 HINT_REQUEST 之後的 state）
   * @returns {Promise<object>} HINT_READY 或 HINT_FAILED action
   */
  function requestHint(state) {
    return submit(state, 'hint');
  }

  /**
   * 請求示範。
   * @param {object} state - engine state（通常是剛送出 DEMO_REQUEST 之後的 state）
   * @param {'suggest'|'lbl'} kind
   * @returns {Promise<object>} DEMO_READY 或 DEMO_FAILED action
   */
  function requestDemo(state, kind) {
    if (kind !== 'suggest' && kind !== 'lbl') {
      return Promise.resolve({ type: 'DEMO_FAILED', payload: { version: state.version, code: 'BAD_REQUEST' } });
    }
    return submit(state, kind);
  }
